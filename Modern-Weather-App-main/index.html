<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Weather App</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Animated Background -->
    <div class="background"></div>

    <!-- Loader -->
    <div id="loader" class="loader" style="display:none;">
        <div class="spinner"></div>
        <p>Loading Weather...</p>
    </div>

    <!-- Weather Container -->
    <div class="container">

        <h1>🌤 Weather App</h1>

        <!-- Search -->
        <div class="search-box">

            <input
                type="text"
                id="city"
                placeholder="Enter city name">

            <button id="searchBtn">
                <i class="fas fa-search"></i>
            </button>

            <button id="locationBtn">
                <i class="fas fa-location-dot"></i>
            </button>

        </div>

        <!-- Error -->
        <div id="error" class="error"></div>

        <!-- Weather -->
        <div id="weather" class="weather-card">

            <!-- Main Weather -->

            <div class="main-weather">

                <h2 id="location">
                    London, UK
                </h2>

                <img
                    id="icon"
                    src=""
                    alt="weather">

                <h1 id="temp">
                    25°C
                </h1>

                <h3 id="condition">
                    Sunny
                </h3>

            </div>

            <!-- Weather Details -->

            <div class="details">

                <div class="card">

                    <i class="fas fa-temperature-half"></i>

                    <h4>Feels Like</h4>

                    <p id="feelsLike">--</p>

                </div>

                <div class="card">

                    <i class="fas fa-droplet"></i>

                    <h4>Humidity</h4>

                    <p id="humidity">--</p>

                </div>

                <div class="card">

                    <i class="fas fa-wind"></i>

                    <h4>Wind</h4>

                    <p id="wind">--</p>

                </div>

                <div class="card">

                    <i class="fas fa-eye"></i>

                    <h4>Visibility</h4>

                    <p id="visibility">--</p>

                </div>

                <div class="card">

                    <i class="fas fa-gauge-high"></i>

                    <h4>Pressure</h4>

                    <p id="pressure">--</p>

                </div>

                <div class="card">

                    <i class="fas fa-sun"></i>

                    <h4>UV Index</h4>

                    <p id="uv">--</p>

                </div>

                <div class="card">

                    <i class="fas fa-sunrise"></i>

                    <h4>Sunrise</h4>

                    <p id="sunrise">--</p>

                </div>

                <div class="card">

                    <i class="fas fa-sunset"></i>

                    <h4>Sunset</h4>

                    <p id="sunset">--</p>

                </div>

                <div class="card">

                    <i class="fas fa-moon"></i>

                    <h4>Moon Phase</h4>

                    <p id="moonPhase">--</p>

                </div>

                <div class="card">

                    <i class="fas fa-smog"></i>

                    <h4>Air Quality</h4>

                    <p id="airQuality">--</p>

                </div>

                <div class="card full">

                    <i class="fas fa-clock"></i>

                    <h4>Local Time</h4>

                    <p id="time">--</p>

                </div>

            </div>

        </div>

        <!-- Forecast -->

        <div class="forecast-section">

            <h2>
                5-Day Forecast
            </h2>

            <div
                id="forecast"
                class="forecast-grid">

                <!-- JavaScript will insert forecast cards here -->

            </div>

        </div>

    </div>

    <!-- JavaScript -->

    <script src="script.js"></script>

</body>
</html>
